<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- CLIPBOARD -->
  <!-- Clipboard Outer Border / Board (Deep Blue) -->
  <rect x="36" y="16" width="46" height="66" rx="5" fill="#1976d2"/>
  <!-- Clipboard White Paper -->
  <rect x="39.5" y="22" width="39" height="56" rx="3" fill="#ffffff"/>

  <!-- Metal Clip at Top with Orange Accent -->
  <rect x="49" y="13" width="20" height="8" rx="2" fill="#cfd8dc"/>
  <rect x="52" y="11" width="14" height="4" rx="1.5" fill="#ff7043"/>

  <!-- Red Medical Cross on Paper (Top Right) -->
  <circle cx="68" cy="30" r="5" fill="#e53935"/>
  <path d="M68 27.5V32.5M65.5 30H70.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Document Lines -->
  <line x1="45" y1="28" x2="60" y2="28" stroke="#90a4ae" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="45" y1="36" x2="73" y2="36" stroke="#b0bec5" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="45" y1="42" x2="73" y2="42" stroke="#cfd8dc" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="45" y1="48" x2="73" y2="48" stroke="#cfd8dc" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="45" y1="54" x2="67" y2="54" stroke="#cfd8dc" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="45" y1="60" x2="71" y2="60" stroke="#cfd8dc" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="45" y1="66" x2="63" y2="66" stroke="#cfd8dc" stroke-width="1.8" stroke-linecap="round"/>

  <!-- STETHOSCOPE -->
  <!-- Earpieces on Left Top -->
  <path d="M22 28C22 22 25 18 29 18C33 18 36 22 36 28" stroke="#78909c" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="22" cy="29" r="2.2" fill="#37474f"/>
  <circle cx="36" cy="29" r="2.2" fill="#37474f"/>
  <path d="M29 18V28" stroke="#78909c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Orange/Coral Flexible Tube curving under clipboard -->
  <path d="M29 28C29 44 20 50 20 64C20 74 30 78 42 78C48 78 54 74 54 68" stroke="#ff7043" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Stethoscope Chestpiece / Diaphragm -->
  <circle cx="54" cy="68" r="6" fill="#78909c"/>
  <circle cx="54" cy="68" r="3.8" fill="#ff7043"/>
</svg>
